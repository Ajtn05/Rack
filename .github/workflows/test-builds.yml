name: Tests and test builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  test-build:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verification-*
          path: dist/verification-input
      - name: Package the verified source
        run: python3 Scripts/release.py test-build --verification dist/verification-input
      - name: Retain installable test build and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rack-test-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/test-builds/
          if-no-files-found: warn
          retention-days: 14
