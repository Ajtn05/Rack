name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Check module boundaries and test registration
        run: |
          sh Scripts/check-boundaries.sh
          sh Scripts/check-test-registration.sh
      - name: Debug tests and theme rendering
        run: swift run RackTests
      - name: Optimized audio and model tests
        run: swift run -c release -Xswiftc -enable-testing RackTests --headless
      - name: Build and verify universal preview archive
        run: sh Scripts/package-release.sh
      - name: Upload release preparation files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rack-preview-${{ github.sha }}
          path: dist/*/*
          if-no-files-found: error
          retention-days: 14
