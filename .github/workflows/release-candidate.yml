name: Prepare preview release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and package (for example v0.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.tag }}
  candidate:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verification-*
          path: dist/verification-input
      - name: Prepare immutable prerelease candidate
        env:
          RACK_RELEASE_TAG: ${{ inputs.tag }}
        run: python3 Scripts/release.py candidate --preview --tag "$RACK_RELEASE_TAG" --verification dist/verification-input
      - name: Retain candidate and all verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rack-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/releases/
          if-no-files-found: warn
          retention-days: 90
